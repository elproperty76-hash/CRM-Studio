<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gothicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gothicBg)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Inner Border Accent -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.35"/>
  
  <!-- Gothic Letter L (Mathematical Fraktur Capital L) -->
  <text 
    x="32" 
    y="46" 
    font-family="'UnifrakturMaguntia', 'Old English Text MT', 'Fraktur', serif" 
    font-size="44" 
    font-weight="bold" 
    text-anchor="middle" 
    fill="url(#goldText)" 
    filter="url(#shadow)"
  >𝕷</text>
</svg>
